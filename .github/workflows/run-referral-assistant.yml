name: Run Referral Assistant

on:
  workflow_dispatch:

  schedule:
    # 12:00 PM IST
    - cron: "30 6 * * *"

    # 4:00 PM IST
    - cron: "30 10 * * *"

    # 6:00 PM IST
    - cron: "30 12 * * *"

    # 10:00 PM IST
    - cron: "30 16 * * *"

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "ERROR: GCP_CREDENTIALS_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GCP_CREDENTIALS_JSON" > credentials.json

      - name: Write Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "ERROR: GOOGLE_TOKEN_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Run Referral Assistant
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_PATH: resume/resume.txt
        run: |
          python app.py