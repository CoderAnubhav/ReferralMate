name: Run Referral Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # every day at 08:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write credentials file
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "GCP_CREDENTIALS_JSON secret is required"
            exit 1
          fi
          echo "$GCP_CREDENTIALS_JSON" > credentials.json

      - name: Write Slack secret file
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_PATH: ${{ secrets.RESUME_PATH }}
        run: |
          cat > .env <<'EOF'
          SLACK_BOT_TOKEN="${SLACK_BOT_TOKEN}"
          SLACK_CHANNEL_ID="${SLACK_CHANNEL_ID}"
          GEMINI_API_KEY="${GEMINI_API_KEY}"
          RESUME_PATH="${RESUME_PATH}"
          EOF

      - name: Ensure resume directory
        run: |
          if [ -n "${RESUME_PATH}" ]; then
            mkdir -p "$(dirname "$RESUME_PATH")"
          else
            mkdir -p resume
          fi

      - name: Run Referral Assistant
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_PATH: ${{ secrets.RESUME_PATH }}
        run: |
          python app.py
